language = "C"

include_guard = "_FSRS_DART_H"
include_version = false
namespaces = []
using_namespaces = []
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
includes = []
no_includes = true
after_includes = ""

braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "auto"
documentation_length = "full"
line_endings = "LF"

style = "both"
sort_by = "Name"
usize_is_size_t = true

[export]
include = []
exclude = []
prefix = "fsrs_"
item_types = []
renaming_overrides_prefixing = false

[fn]
rename_args = "None"
args = "auto"
sort_by = "Name"

[struct]
rename_fields = "None"
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = true
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
enum_class = true
private_default_tagged_enum_constructor = false

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "Name"

[macro_expansion]
bitflags = false

[parse]
parse_deps = true
include = ["fsrs"]

[parse.expand]
crates = []
all_features = false
default_features = true
features = []
